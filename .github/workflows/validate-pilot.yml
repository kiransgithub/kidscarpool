name: Validate KCP pilot

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - '.github/workflows/validate-pilot.yml'

permissions:
  contents: read

jobs:
  client-and-migration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and parse the PWA module
        run: |
          cat web/app.parts/*.js > /tmp/kcp-app.mjs
          node --check /tmp/kcp-app.mjs
          node --check web/logic.js
          node --check web/persistence.js
          node --check web/generic-schedule.js
      - name: Run client logic and visual contract tests
        run: node --test web/tests/*.test.mjs
      - name: Validate manifest, ERD and migration structure
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          json.loads(Path('web/manifest.webmanifest').read_text())
          erd = Path('docs/database-erd.md').read_text()
          assert '```mermaid' in erd and 'erDiagram' in erd, 'Database ERD is missing'

          required_assets = [
              'web/generic-schedule.css',
              'web/generic-schedule.js',
              'web/schedule-builder-usability.css',
              'web/weekly-matrix-flow.css',
              'web/app.parts/12-weekly-matrix-flow.js'
          ]
          for asset in required_assets:
              assert Path(asset).exists(), f'Missing required client asset: {asset}'

          migrations = sorted(Path('supabase/migrations').glob('*.sql'))
          assert migrations, 'No Supabase migrations found'
          for migration in migrations:
              text = migration.read_text()
              assert text.count('$$') % 2 == 0, f'Unbalanced $$ in {migration}'
              assert text.strip().endswith('commit;'), f'{migration} must end in commit;'

          # The repository now uses one consolidated baseline migration. Scan
          # executable SQL rather than archived migration filenames. Scenario
          # names are allowed in comments, seeds and tests, never in the actual
          # production scheduling statements.
          baseline = Path('supabase/migrations/00000000000001_kcp_baseline.sql')
          assert baseline.exists(), 'Consolidated KCP baseline migration is missing'
          executable_sql = re.sub(r'--[^\n]*', '', baseline.read_text())
          forbidden = re.compile(r'\b(Kiran|Mohan|Santhosh|Pavan|DRMA)\b', re.I)
          match = forbidden.search(executable_sql)
          assert not match, f'Hard-coded scheduling identity found in production SQL: {match.group(0)}'

          print(f'Validated {len(migrations)} migration(s), client assets and genericity guard')
          PY

  fresh-supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - name: Apply every migration to a fresh local Supabase database
        run: supabase db start
      - name: Fail on database lint findings
        run: |
          supabase db lint --local --level warning > /tmp/kcp-db-lint.json
          cat /tmp/kcp-db-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/kcp-db-lint.json').read_text().strip()
          findings = json.loads(raw or '[]')
          if findings:
              raise SystemExit(f'Database lint returned {len(findings)} finding(s)')
          print('Database lint returned zero findings')
          PY
      - name: Run database regression and integration suites
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/regression_20260806_usability.sql
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/integration_generic_group_lifecycle.sql
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/integration_recovery_cover_withdrawal.sql
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/integration_generic_schedule_builder.sql
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/integration_stable_participant_recovery.sql
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/regression_owner_transfer_invariant.sql
      - name: Show migration status
        run: supabase migration list --local
