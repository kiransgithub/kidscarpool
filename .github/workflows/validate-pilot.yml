name: Validate KCP pilot

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - '00_supabase_become.sql'
      - '.github/workflows/validate-pilot.yml'

permissions:
  contents: read

jobs:
  client-and-migration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and parse the database-driven PWA runtime
        run: |
          node web/build-runtime.mjs /tmp/kcp-app.mjs
          node --check /tmp/kcp-app.mjs
          node --check web/logic.js
          node --check web/persistence.js
          node --check web/generic-schedule.js
      - name: Run client logic and visual contract tests
        run: node --test web/tests/*.test.mjs
      - name: Validate manifest, ERD, runtime and migration structure
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          json.loads(Path('web/manifest.webmanifest').read_text())
          erd = Path('docs/database-erd.md').read_text()
          assert '```mermaid' in erd and 'erDiagram' in erd, 'Database ERD is missing'

          required_assets = [
              'web/build-runtime.mjs',
              'web/generic-schedule.css',
              'web/generic-schedule.js',
              'web/schedule-builder-usability.css',
              'web/weekly-matrix-flow.css',
              'web/app.parts/12-weekly-matrix-flow.js',
              'web/app.parts/13-published-availability.js',
              'web/app.parts/14-database-driven-ui.js',
              'web/app.parts/15-generic-recovery.js'
          ]
          for asset in required_assets:
              assert Path(asset).exists(), f'Missing required client asset: {asset}'

          migrations = sorted(Path('supabase/migrations').glob('*.sql'))
          assert migrations, 'No Supabase migrations found'
          for migration in migrations:
              text = migration.read_text()
              assert text.count('$$') % 2 == 0, f'Unbalanced $$ in {migration}'
              assert text.strip().endswith('commit;'), f'{migration} must end in commit;'

          baseline = Path('supabase/migrations/00000000000001_kcp_baseline.sql')
          assert baseline.exists(), 'Consolidated KCP baseline migration is missing'
          executable_sql = re.sub(r'--[^\n]*', '', baseline.read_text())
          forbidden_sql = re.compile(r'\b(Kiran|Mohan|Santhosh|Santosh|Pavan|DRMA)\b', re.I)
          match = forbidden_sql.search(executable_sql)
          assert not match, f'Hard-coded identity found in production SQL: {match.group(0)}'

          runtime = Path('/tmp/kcp-app.mjs').read_text()
          index = Path('web/index.html').read_text()
          forbidden_ui = re.compile(
              r'BASIS|KCP-BASIS|basis-phoenix|'
              r'\b(?:Kiran|Mohan|Santhosh|Santosh|Pavan|Thanishka|Saanvi|Kavish|Ishi)\b',
              re.I
          )
          for name, text in [('runtime', runtime), ('index', index)]:
              match = forbidden_ui.search(text)
              assert not match, f'Pilot-specific data found in production {name}: {match.group(0)}'

          assert "p_scheduled - interval '10 minutes'" in executable_sql
          assert "p_scheduled + interval '90 minutes'" in executable_sql
          print(f'Validated {len(migrations)} migration(s), DB-driven runtime and genericity guards')
          PY

  fresh-supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - name: Apply the consolidated baseline to a fresh local Supabase database
        run: supabase db start
      - name: Fail on database lint findings
        run: |
          supabase db lint --local --level warning > /tmp/kcp-db-lint.json
          cat /tmp/kcp-db-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/kcp-db-lint.json').read_text().strip()
          findings = json.loads(raw or '[]')
          if findings:
              raise SystemExit(f'Database lint returned {len(findings)} finding(s)')
          print('Database lint returned zero findings')
          PY
      - name: Run consolidated database regression and integration suites
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -1)"
          test -n "$DB_CONTAINER"
          run_sql() {
            echo "==> $1"
            sed 's/auth\.become/public.kcp_test_become/g' "$2" \
              | docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          }
          run_sql "Supabase test impersonation helper" 00_supabase_become.sql
          run_sql "pilot seed fixture" supabase/seeds/basis_pilot.sql
          run_sql "generic-engine seed equivalence" supabase/tests/equivalence_basis_generic.sql
          run_sql "single-owner invariant" supabase/tests/regression_owner_invariant.sql
          run_sql "group lifecycle end to end" supabase/tests/integration_group_lifecycle.sql
          run_sql "weekend schedule and availability" supabase/tests/regression_weekend_schedule.sql
      - name: Show migration status
        run: supabase migration list --local
