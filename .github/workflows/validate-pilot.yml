name: Validate KCP pilot

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - '00_supabase_become.sql'
      - '.github/workflows/validate-pilot.yml'

permissions:
  contents: read

jobs:
  client-and-migration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and parse every browser module
        run: |
          node web/build-runtime.mjs /tmp/kcp-app.mjs
          node --check /tmp/kcp-app.mjs
          find web -maxdepth 2 -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Run all client logic and visual contract tests
        run: node --test web/tests/*.test.mjs
      - name: Validate manifest, ERD, runtime and migration lineage
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          json.loads(Path('web/manifest.webmanifest').read_text())
          erd = Path('docs/database-erd.md').read_text()
          assert '```mermaid' in erd and 'erDiagram' in erd, 'Database ERD is missing'
          assert list(Path('web/app.parts').glob('*.js')), 'PWA modules are missing'
          assert list(Path('web/tests').glob('*.test.mjs')), 'Client tests are missing'

          baseline = Path('supabase/baseline/00000000000001_kcp_baseline.sql')
          assert baseline.exists(), 'Consolidated baseline must live outside the linked migration directory'
          assert not Path('supabase/migrations/00000000000001_kcp_baseline.sql').exists(), 'Baseline must never be pushed to the linked project'

          migrations = sorted(Path('supabase/migrations').glob('*.sql'))
          versions = [item.name.split('_', 1)[0] for item in migrations]
          expected_history = [
              '202608060001','202608060002','202608060003','202608060004',
              '202608060005','202608060006','202608060007','202608060008',
              '202608060009','202608060010','202608060011','202608060012',
              '202608060013','202608060014','202608060015','202608060016',
              '202608060017','202608060018','202608060020','202608060021',
              '202608060022','202608060023','202608060024','202608060025',
              '202608060026','202608070001'
          ]
          assert versions[:len(expected_history)] == expected_history, (
              f'Linked migration history changed. Expected prefix {expected_history}, got {versions}'
          )
          assert versions == sorted(versions), 'Migrations must remain timestamp ordered'
          for migration in migrations:
              text = migration.read_text()
              assert text.count('$$') % 2 == 0, f'Unbalanced $$ in {migration}'
              assert text.strip().endswith('commit;'), f'{migration} must end in commit;'

          executable_sql = re.sub(r'--[^\n]*', '', baseline.read_text())
          forbidden_sql = re.compile(r'\b(Kiran|Mohan|Santhosh|Santosh|Pavan|DRMA)\b', re.I)
          match = forbidden_sql.search(executable_sql)
          assert not match, f'Hard-coded identity found in production baseline: {match.group(0)}'

          runtime = Path('/tmp/kcp-app.mjs').read_text()
          index = Path('web/index.html').read_text()
          forbidden_ui = re.compile(
              r'BASIS|KCP-BASIS|basis-phoenix|'
              r'\b(?:Kiran|Mohan|Santhosh|Santosh|Pavan|Thanishka|Saanvi|Kavish|Ishi)\b',
              re.I
          )
          for name, text in [('runtime', runtime), ('index', index)]:
              match = forbidden_ui.search(text)
              assert not match, f'Pilot-specific data found in production {name}: {match.group(0)}'

          schedule_helper = Path('web/generic-schedule.js').read_text()
          assert "'07:00'" not in schedule_helper, 'Generic schedule helper must not invent a morning time'
          assert "'15:35'" not in schedule_helper, 'Generic schedule helper must not invent a pickup time'
          assert "p_scheduled - interval '10 minutes'" in executable_sql
          assert "p_scheduled + interval '90 minutes'" in executable_sql
          print(f'Validated {len(migrations)} linked migration(s), baseline, runtime and all discovered assets')
          PY

  fresh-supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - name: Apply every forward migration to a fresh local Supabase database
        run: supabase db start
      - name: Fail on database lint findings
        run: |
          supabase db lint --local --level warning > /tmp/kcp-db-lint.json
          cat /tmp/kcp-db-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path('/tmp/kcp-db-lint.json').read_text().strip() or '[]')
          if findings:
              raise SystemExit(f'Database lint returned {len(findings)} finding(s)')
          print('Database lint returned zero findings')
          PY
      - name: Run every database regression and integration suite
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -1)"
          test -n "$DB_CONTAINER"
          run_sql() {
            echo "==> $1"
            sed 's/auth\.become/public.kcp_test_become/g' "$1" \
              | docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          }
          run_sql 00_supabase_become.sql
          run_sql supabase/seeds/basis_pilot.sql
          run_sql supabase/tests/equivalence_basis_generic.sql
          for file in $(find supabase/tests -maxdepth 1 \( -name 'regression_*.sql' -o -name 'integration_*.sql' \) | sort); do
            run_sql "$file"
          done
      - name: Show migration status
        run: supabase migration list --local
