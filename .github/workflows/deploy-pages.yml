name: Deploy KCP pilot to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'SchoolCarpool/Resources/Assets.xcassets/AppIcon.appiconset/KCP-AppIcon-1024.png'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static PWA
        run: |
          mkdir -p _site
          cp -R web/. _site/
          cp SchoolCarpool/Resources/Assets.xcassets/AppIcon.appiconset/KCP-AppIcon-1024.png _site/icon-1024.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
